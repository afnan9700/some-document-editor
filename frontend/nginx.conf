server {
listen 80;
server_name localhost;
root /usr/share/nginx/html;
index index.html;

# 1. The SPA Routing Fix
location / {
    try_files $uri $uri/ /index.html;
}

# 2. Prevent Stale Deployments: Never cache index.html
location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    expires off;
}

# 3. Optimize Performance: Cache hashed static assets permanently
location ~* \.(?:css|js|jpg|svg|woff2?|ico)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
}
}